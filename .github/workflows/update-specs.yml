name: Update Spec Files

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-specs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Generate Antigravity Spec
        run: |
          bash ./generate_antigravity_spec.sh

      - name: Generate Antigravity CLI Spec
        run: |
          bash ./generate_cli_spec.sh

      - name: Generate Antigravity IDE Spec
        run: |
          bash ./generate_ide_spec.sh

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add antigravity.spec antigravity-cli.spec antigravity-ide.spec
          VERSION_AGY=$(grep -E '(%global package_version|Version:)' antigravity.spec | awk '{print $NF}' | grep -E '^[0-9]' | head -n1)
          VERSION_CLI=$(grep -E '(%global package_version|Version:)' antigravity-cli.spec | awk '{print $NF}' | grep -E '^[0-9]' | head -n1)
          VERSION_IDE=$(grep -E '(%global package_version|Version:)' antigravity-ide.spec | awk '{print $NF}' | grep -E '^[0-9]' | head -n1)
          git commit -m "chore: update specs - antigravity ${VERSION_AGY}, cli ${VERSION_CLI}, ide ${VERSION_IDE}"
          git push

      - name: Install copr-cli
        if: steps.git-check.outputs.changes == 'true'
        run: pip install copr-cli

      - name: Write COPR config
        if: steps.git-check.outputs.changes == 'true'
        run: |
          mkdir -p ~/.config
          echo "${{ secrets.COPR_CONFIG }}" > ~/.config/copr

      - name: Trigger COPR builds
        if: steps.git-check.outputs.changes == 'true'
        run: |
          VERSION_AGY=$(grep -E '(%global package_version|Version:)' antigravity.spec | awk '{print $NF}' | grep -E '^[0-9]' | head -n1)
          VERSION_CLI=$(grep -E '(%global package_version|Version:)' antigravity-cli.spec | awk '{print $NF}' | grep -E '^[0-9]' | head -n1)
          VERSION_IDE=$(grep -E '(%global package_version|Version:)' antigravity-ide.spec | awk '{print $NF}' | grep -E '^[0-9]' | head -n1)

          check_and_build() {
            local package_name=$1
            local version=$2
            local spec_file=$3

            BUILDS=$(copr-cli list-builds n0va-bot/agy --output-format json)

            if echo "$BUILDS" | grep -q "\"name\": \"$package_name\",\"state\": \"succeeded\""; then
              echo "Package $package_name already has a successful build, skipping..."
            else
              echo "Triggering build for $package_name..."
              copr-cli buildscm n0va-bot/agy \
                --clone-url ${{ github.server_url }}/${{ github.repository }} \
                --commit ${{ github.sha }} \
                --spec $spec_file \
                --type git \
                --nowait
            fi
          }

          check_and_build "antigravity" "$VERSION_AGY" "antigravity.spec"
          check_and_build "antigravity-cli" "$VERSION_CLI" "antigravity-cli.spec"
          check_and_build "antigravity-ide" "$VERSION_IDE" "antigravity-ide.spec"
